<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q2Stats · Poll admin</title><link rel="stylesheet" href="styles.css?v=poll1"></head><body><main class="wrap"><a href="admin.html">← Main admin</a><section class="panel"><h1>Rating poll administration</h1><p>Use your existing Q2Stats admin key. It stays in this page's memory and is not saved.</p><form id="pollAdminForm"><label>Admin key <input id="pollAdminKey" type="password" autocomplete="off" required></label> <button class="poll-submit">Connect / refresh</button></form><p><button class="poll-submit" id="pollOpen" disabled>Open poll</button> <button class="poll-submit" id="pollClose" disabled>Close poll</button></p><p id="pollAdminStatus" role="status"></p><div id="pollAdminResults"></div></section></main><script>
const form=document.getElementById('pollAdminForm'),key=document.getElementById('pollAdminKey'),status=document.getElementById('pollAdminStatus'),results=document.getElementById('pollAdminResults'),openButton=document.getElementById('pollOpen'),closeButton=document.getElementById('pollClose');
async function load(isOpen){openButton.disabled=closeButton.disabled=true;status.textContent='Loading…';try{const r=await fetch('/api/admin/rating-poll',{method:isOpen===undefined?'GET':'POST',cache:'no-store',headers:{'x-q2stats-admin-key':key.value,...(isOpen===undefined?{}:{'Content-Type':'application/json'})},...(isOpen===undefined?{}:{body:JSON.stringify({is_open:isOpen})})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');status.textContent=(d.is_open?'Open':'Closed')+' · '+d.total+' votes';results.replaceChildren();d.options.forEach((label,i)=>{const p=document.createElement('p');p.textContent=label+': '+d.counts[i]+' ('+(d.total?100*d.counts[i]/d.total:0).toFixed(1)+'%)';results.append(p);});openButton.disabled=closeButton.disabled=false;}catch(e){status.textContent=e.message;}}
form.addEventListener('submit',e=>{e.preventDefault();load();});openButton.onclick=()=>load(true);closeButton.onclick=()=>{if(confirm('Close this poll? Existing votes will be kept.'))load(false);};
</script></body></html>
